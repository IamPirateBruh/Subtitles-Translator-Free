<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Subtitle Translator</title>
  <meta name="description" content="Translate SRT, VTT and ASS subtitle files into more than 100 languages.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('st-theme');
        if (t) document.documentElement.dataset.theme = t;
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <header class="top">
    <div>
      <h1>Subtitle Translator</h1>
      <p>Translate SRT, VTT and ASS files. Timings and styling stay as they were.</p>
    </div>
    <button id="themeBtn" class="icon-btn" type="button" aria-label="Switch between light and dark mode">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <circle cx="12" cy="12" r="9"></circle>
        <path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor"></path>
      </svg>
    </button>
  </header>

  <main class="layout">
    <div id="serverWarn" class="warn" role="alert" hidden></div>

    <section class="panel controls" aria-label="Translation settings">
      <label id="drop" class="drop" tabindex="0">
        <input id="file" type="file" accept=".srt,.vtt,.ass,.ssa,.txt" multiple hidden>
        <strong>Drop subtitle files here</strong>
        <span>One file or many. Click to browse. Supports .srt, .vtt, .ass and .ssa</span>
      </label>

      <div id="files" class="files" hidden>
        <div class="files-head">
          <span id="filesTitle">File</span>
          <button id="clearFiles" class="link-btn" type="button">Clear all</button>
        </div>
        <ul id="fileList" class="file-list"></ul>
        <div id="fileInfo" class="file-info"></div>
      </div>

      <details class="paste">
        <summary>Paste subtitle text instead</summary>
        <textarea id="pasteArea" rows="6" placeholder="Paste SRT, VTT or ASS content here"></textarea>
        <button id="pasteLoad" class="btn" type="button">Add pasted text</button>
      </details>
      <button id="sampleBtn" class="link-btn" type="button">Try a Spanish sample</button>

      <div class="lang-row">
        <div class="field">
          <label for="fromLang">From</label>
          <select id="fromLang"></select>
        </div>
        <button id="swapBtn" class="icon-btn" type="button" aria-label="Swap languages" disabled>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M7 4 3 8l4 4M3 8h14M17 20l4-4-4-4M21 16H7"></path>
          </svg>
        </button>
        <div class="field">
          <label for="toLang">To</label>
          <select id="toLang"></select>
        </div>
      </div>

      <fieldset class="options">
        <legend>Options</legend>
        <label class="check"><input type="checkbox" id="optTags" checked> Keep italics and position tags</label>
        <label class="check"><input type="checkbox" id="optBi"> Show the original under the translation</label>
        <label class="check"><input type="checkbox" id="optBom"> Save with a UTF-8 byte order mark</label>
      </fieldset>

      <div class="actions">
        <button id="translateBtn" class="btn primary" type="button" disabled>Translate</button>
        <button id="cancelBtn" class="btn" type="button" hidden>Cancel</button>
      </div>

      <div id="progress" class="progress" hidden>
        <div class="bar" aria-hidden="true"><span id="barFill"></span></div>
        <p id="status" role="status" aria-live="polite"></p>
      </div>
    </section>

    <section class="stage" aria-label="Preview and results">
      <figure class="screen" id="screen">
        <div class="screen-bar">
          <span id="cueLabel">Preview</span>
          <span id="cueTime" class="mono"></span>
          <span class="screen-nav">
            <button id="prevCue" class="icon-btn small" type="button" aria-label="Previous cue" disabled>&#8249;</button>
            <button id="nextCue" class="icon-btn small" type="button" aria-label="Next cue" disabled>&#8250;</button>
          </span>
        </div>
        <figcaption class="caption">
          <span id="capOrig" class="cap-orig"></span>
          <span id="capTrans" class="cap-trans"></span>
        </figcaption>
      </figure>

      <div id="exportBar" class="exportbar" hidden>
        <div class="field inline">
          <label for="outFmt">Save as</label>
          <select id="outFmt">
            <option value="same">Same as source</option>
            <option value="srt">SRT</option>
            <option value="vtt">WebVTT</option>
          </select>
        </div>
        <div class="export-actions">
          <button id="copyBtn" class="btn" type="button">Copy text</button>
          <button id="downloadBtn" class="btn primary" type="button">Download</button>
          <button id="downloadAllBtn" class="btn primary" type="button" hidden>Download all (ZIP)</button>
        </div>
      </div>

      <div id="cuesWrap" class="panel cues" hidden>
        <div class="cues-title">Editing <b id="activeName"></b></div>
        <div class="cues-tools">
          <input id="search" type="search" placeholder="Search cues" aria-label="Search cues">
          <button id="retryBtn" class="btn" type="button" hidden>Retry failed (<span id="failCount">0</span>)</button>
          <div class="pager">
            <button id="pgPrev" class="btn small" type="button">Previous</button>
            <span id="pgLabel"></span>
            <button id="pgNext" class="btn small" type="button">Next</button>
          </div>
        </div>
        <div class="cue-head" aria-hidden="true">
          <span>Time</span><span>Original</span><span>Translation (editable)</span>
        </div>
        <div id="cueList" class="cue-list"></div>
      </div>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
